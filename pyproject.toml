[project]
name = "auto-paper-download"
version = "0.2.0"
description = "Automated PDF downloader for DOIs exported from Web of Science."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
]
authors = [
  { name = "Auto Paper Download" },
]

[project.optional-dependencies]
# Playwright-driven browser fallback for paywalled publishers without a TDM API
# (ACS / RSC / IEEE / AIP / IOP / APS / Annual Reviews / Taylor & Francis / etc.).
# Install with:  pip install 'auto-paper-download[browser]'  &&  playwright install chromium
browser = [
  "playwright>=1.40",
]

[project.scripts]
auto-paper-download = "auto_paper_download.__main__:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auto_paper_download"]
