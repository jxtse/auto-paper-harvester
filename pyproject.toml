[project]
name = "auto-paper-download"
version = "0.4.0"
description = "Download full-text PDFs by DOI: open access first, then publisher TDM APIs, then your own logged-in browser. CLI, local web UI and agent skill."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12",
]
authors = [
  { name = "Jinxiang Xie" },
]
license = { text = "MIT" }
keywords = ["doi", "pdf", "open-access", "unpaywall", "openalex", "crossref", "text-and-data-mining",
            "literature", "research-tools", "agent-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Environment :: Console",
  "Environment :: Web Environment",
]

[project.urls]
Homepage = "https://github.com/jxtse/auto-paper-harvester"
Issues = "https://github.com/jxtse/auto-paper-harvester/issues"

[project.optional-dependencies]
# Playwright-driven browser fallback for paywalled publishers without a TDM API
# (ACS / RSC / IEEE / AIP / IOP / APS / Annual Reviews / Taylor & Francis / etc.).
# Install with:  pip install 'auto-paper-download[browser]'  &&  playwright install chromium
browser = [
  "playwright>=1.40",
]
dev = [
  "pytest>=7",
]

[project.scripts]
auto-paper-download = "auto_paper_download.__main__:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auto_paper_download"]

[tool.setuptools.package-data]
auto_paper_download = ["ui/*.html", "skill/SKILL.md"]
